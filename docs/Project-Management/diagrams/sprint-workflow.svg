;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="100.185" y="383.279" fill="#000" font-size="12" textLength="233.051">Break items into implementation tasks</text><rect x="130.576" y="416.109" width="172.268" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.576" y="437.248" fill="#000" font-size="12" textLength="152.268">Implement selected work</text><rect x="143.596" y="470.078" width="146.229" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="153.596" y="491.217" fill="#000" font-size="12" textLength="126.229">Run automated tests</text><rect x="110.845" y="524.047" width="211.73" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="120.845" y="545.186" fill="#000" font-size="12" textLength="191.73">Run quality and security checks</text><polygon points="127.375,578.016,306.045,578.016,318.045,590.016,306.045,602.016,127.375,602.016,115.375,590.016,127.375,578.016" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="127.375" y="593.824" fill="#000" font-size="11" textLength="178.669">All acceptance criteria satisfied?</text><text x="96.367" y="587.421" fill="#000" font-size="11" textLength="19.008">yes</text><text x="318.045" y="587.421" fill="#000" font-size="11" textLength="13.702">no</text><rect x="18.285" y="612.016" width="166.666" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="28.285" y="633.154" fill="#000" font-size="12" textLength="146.666">Review sprint increment</text><rect x="16" y="665.984" width="171.236" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="687.123" fill="#000" font-size="12" textLength="151.236">Record sprint completion</text><rect x="207.236" y="612.016" width="249.131" height="33.969" fill="#F1F1F1" style="stroke